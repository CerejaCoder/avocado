<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/src/imgs/icone.png" type="image/x-icon">
    <link rel="stylesheet" href="/src/output.css">
    <link rel="stylesheet" href="./style.css">
    <title>Perfil</title>
</head>
<body>
    <div class="drawer lg:drawer-open">
        <input id="my-drawer-4" type="checkbox" class="drawer-toggle inline" />

        <div class="drawer-content">
            <!-- Navbar -->
            <nav class="navbar w-full bg-base-100 p-5 sticky top-0 shadow-md z-2 l-0">
                <div class="flex-1">
                    <label for="my-drawer-4" aria-label="open sidebar" class="btn btn-square btn-ghost drawer-button hidden" id="sidebarLeftButton">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"></path><path d="M9 4v16"></path><path d="M14 10l2 2l-2 2"></path></svg>
                    </label>

                    <div class="flex items-center">
                        <img class="w-14 mr-3" src="/src/imgs/icone.png" alt="Icone Avocado">
                        <h1 class="text-3xl">Avocado</h1>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button class="btn rounded-full p-2">
                        <label class="swap swap-rotate">
                            <input id="theme" type="checkbox" class="theme-controller" value="black" />

                            <svg class="swap-off h-6 w-6 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" />
                            </svg>

                            <svg class="swap-on h-6 w-6 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z" />
                            </svg>
                        </label>
                    </button>
                    <div class="dropdown dropdown-end">
                        <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
                            <div class="w-10 rounded-full">
                                <img alt="Tailwind CSS Navbar component" src="https://img.daisyui.com/images/stock/photo-1534528741775-53994a69daeb.webp" />
                            </div>
                        </div>
                        <ul tabindex="-1" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
                            <li><a>Perfil</a></li>
                            <li><a>Sair</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
            
            <main class="flex flex-col m-auto mt-10 mb-30 items-center justify-center w-lg max-w-9/10">
                <article class="headerPerfil flex gap-20 flex-wrap items-center justify-center">
                    <aside class="avatar">
                        <div class="imgPerfil w-48 rounded-full">
                            <img alt="Imagem de perfil do usuário" src="https://img.daisyui.com/images/profile/demo/yellingcat@192.webp" />
                        </div>
                    </aside>

                    <aside class="flex flex-col gap-5 items-start justify-center">
                        <h3>NewExit</h3>
                        <h4>Guilherme Cereja</h4>
                    </aside>
                </article>

                <div class="divider"></div>

                <article class="bodyPerfil flex flex-wrap gap-4 items-start ">
                    <button class="post w-40 h-40 cursor-pointer bg-[url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSICmPX7HVrXVG2gS_IWLY_caJf42RHkS3GgaBlU_cUAQ&s=10)] bg-center bg-cover" value="idPost"></button>
                    <button class="post w-40 h-40 cursor-pointer bg-[url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSICmPX7HVrXVG2gS_IWLY_caJf42RHkS3GgaBlU_cUAQ&s=10)] bg-center bg-cover" value="idPost"></button>
                    <button class="post w-40 h-40 cursor-pointer bg-[url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSICmPX7HVrXVG2gS_IWLY_caJf42RHkS3GgaBlU_cUAQ&s=10)] bg-center bg-cover" value="idPost"></button>
                    <button class="post w-40 h-40 cursor-pointer bg-[url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSICmPX7HVrXVG2gS_IWLY_caJf42RHkS3GgaBlU_cUAQ&s=10)] bg-center bg-cover" value="idPost"></button>
                    <button class="post w-40 h-40 cursor-pointer bg-[url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSICmPX7HVrXVG2gS_IWLY_caJf42RHkS3GgaBlU_cUAQ&s=10)] bg-center bg-cover" value="idPost"></button>
                </article>
            </main>
        </div>

        <div class="drawer-side is-drawer-close:overflow-visible" id="sidebarLeft">
            <label for="my-drawer-4" aria-label="close sidebar" class="drawer-overlay"></label>
            <div class="flex min-h-full flex-col items-start bg-base-300 is-drawer-close:w-14 is-drawer-open:w-64">
                <!-- Sidebar content here -->
                <ul class="menu w-full grow justify-between">
                    <ul>
                        <li>
                            <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Home">
                                <svg class="size-[1.4em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
                                <span class="is-drawer-close:hidden">Home</span>
                            </button>
                        </li>
                        <li>
                            <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Postar">         
                                <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="currentColor" stroke-linejoin="miter" stroke-linecap="butt"><polyline points="3 14 9 14 9 17 15 17 15 14 21 14" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="2"></polyline><rect x="3" y="3" width="18" height="18" rx="2" ry="2" fill="none" stroke="currentColor" stroke-linecap="square" stroke-miterlimit="10" stroke-width="2"></rect></g></svg>
                                <span class="is-drawer-close:hidden">Postar</span>
                            </button>
                        </li>
                        <li>
                            <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Perfil">         
                                <svg class="size-[1.4em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.2" r="4"/><path d="M3.5 21v-1.2a6.3 6.3 0 0 1 6.3-6.3h4.4a6.3 6.3 0 0 1 6.3 6.3V21"/></g></svg>
                                <span class="is-drawer-close:hidden">Perfil</span>
                            </button>
                        </li>
                    </ul>
                    <li>
                        <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right" data-tip="Sair">         
                                <svg class="size-[1.4em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor">
                                    <path d="M10 17l5-5-5-5"></path>
                                    <path d="M15 12H3"></path>
                                    <path d="M12 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"></path>
                                </svg>
                            <span class="is-drawer-close:hidden">Sair</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="dock dock-xl" id="sidebarLower">
        <button class="buttonSidebarLower">
            <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linejoin="round" stroke-linecap="round" stroke-width="2" fill="none" stroke="currentColor" class="my-1.5 inline-block size-4"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <span class="dock-label">Home</span>
        </button>
            
        <button class="buttonSidebarLower">
            <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="currentColor" stroke-linejoin="miter" stroke-linecap="butt"><polyline points="3 14 9 14 9 17 15 17 15 14 21 14" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="2"></polyline><rect x="3" y="3" width="18" height="18" rx="2" ry="2" fill="none" stroke="currentColor" stroke-linecap="square" stroke-miterlimit="10" stroke-width="2"></rect></g></svg>
            <span class="dock-label">Postar</span>
        </button>
            
        <button class="buttonSidebarLower dock-active">
            <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.2" r="4"/><path d="M3.5 21v-1.2a6.3 6.3 0 0 1 6.3-6.3h4.4a6.3 6.3 0 0 1 6.3 6.3V21"/></g></svg>
            <span class="dock-label">Perfil</span>
        </button>
    </div>

    <script type="module" src="./perfil.js"></script>
</body>
</html>
